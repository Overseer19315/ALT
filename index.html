
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08090d">
    <meta name="description" content="A Little History">

    <title>A LITTLE HISTORY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="stage">

    <div id="caption">A LITTLE HISTORY</div>

    <svg
        viewBox="0 0 1000 560"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg"
    >

        <g id="world">

            <!-- ESCENARIO -->
            <rect class="sky" width="1000" height="560"/>
            <path class="ground" d="M0 440 H1000"/>

            <!-- ÁRBOL DE NAVIDAD -->
            <g id="tree" transform="translate(810 260)">

                <path d="M0 0 L-65 110 H65 Z" fill="#183e32"/>
                <path d="M0 55 L-85 180 H85 Z" fill="#245943"/>

                <rect
                    x="-12"
                    y="180"
                    width="24"
                    height="35"
                    fill="#76502f"
                />

                <circle cx="0" cy="0" r="9" fill="#e5bd65"/>
                <circle cx="-25" cy="100" r="7" fill="#e6bd6c"/>
                <circle cx="25" cy="140" r="7" fill="#e6bd6c"/>
                <circle cx="-35" cy="155" r="6" fill="#b84b4b"/>
                <circle cx="35" cy="75" r="6" fill="#b84b4b"/>

            </g>

            <!-- ANDRÉS: CINTA AZUL -->
            <g id="me" class="character">

                <circle class="stick" cx="320" cy="245" r="27"/>

                <path class="stick" d="M320 272 V360"/>

                <path class="stick"
                    d="M320 295 L280 335 L265 365"/>

                <path class="stick"
                    d="M320 295 L360 335 L375 365"/>

                <path class="stick"
                    d="M320 360 L290 420"/>

                <path class="stick"
                    d="M320 360 L350 420"/>

                <path class="band-blue"
                    d="M312 282 L328 282"/>

            </g>

            <!-- BLANCA: CINTA BLANCA -->
            <g id="blanca" class="character">

                <circle class="stick" cx="680" cy="245" r="27"/>

                <path class="stick" d="M680 272 V360"/>

                <path class="stick"
                    d="M680 295 L640 335 L625 365"/>

                <path class="stick"
                    d="M680 295 L720 335 L735 365"/>

                <path class="stick"
                    d="M680 360 L650 420"/>

                <path class="stick"
                    d="M680 360 L710 420"/>

                <path class="band-white"
                    d="M672 282 L688 282"/>

            </g>

            <!-- IMAGINACIÓN -->
            <g id="dream">

                <ellipse
                    id="dreamBubble"
                    cx="500"
                    cy="190"
                    rx="240"
                    ry="140"
                />

                <path
                    d="M365 300 L340 340 L410 290"
                    fill="white"
                    stroke="#252525"
                    stroke-width="3"
                />

                <!-- ANDRÉS EN EL SUEÑO -->
                <g transform="translate(430 150)">

                    <circle class="stick" cx="0" cy="0" r="19"/>

                    <path class="stick"
                        d="M0 20 V90
                           M0 40 L-30 65
                           M0 40 L30 65
                           M0 90 L-20 125
                           M0 90 L20 125"/>

                    <path class="band-blue" d="M-7 25 H7"/>

                </g>

                <!-- BLANCA EN EL SUEÑO -->
                <g transform="translate(565 150)">

                    <circle class="stick" cx="0" cy="0" r="19"/>

                    <path class="stick"
                        d="M0 20 V90
                           M0 40 L-30 65
                           M0 40 L30 65
                           M0 90 L-20 125
                           M0 90 L20 125"/>

                    <path class="band-white" d="M-7 25 H7"/>

                </g>

                <!-- SÍMBOLO DEL BESO -->
                <path
                    d="M470 148 Q500 125 530 148"
                    fill="none"
                    stroke="#c79aab"
                    stroke-width="3"
                />

                <path
                    d="M490 130 Q500 120 510 130"
                    fill="none"
                    stroke="#c79aab"
                    stroke-width="3"
                />

            </g>

            <!-- LANZA -->
            <g id="spear">

                <path
                    d="M500 -30 L500 250"
                    stroke="#555"
                    stroke-width="8"
                />

                <path
                    d="M487 15 L500 -15 L513 15 Z"
                    fill="#777"
                />

            </g>

            <!-- CONSEJO DE TRECE -->
            <g id="council">

                <rect
                    width="1000"
                    height="560"
                    fill="#17171b"
                    opacity=".94"
                />

                <text
                    x="500"
                    y="80"
                    fill="#d5d0d0"
                    font-size="24"
                    text-anchor="middle"
                    letter-spacing="7"
                >
                    THE COUNCIL
                </text>

                <g id="members"></g>

                <text
                    x="500"
                    y="490"
                    fill="#bdb4b4"
                    font-size="13"
                    text-anchor="middle"
                    letter-spacing="5"
                >
                    JUDGEMENT
                </text>

            </g>

            <!-- NIEVE -->
            <g id="snow"></g>

        </g>

    </svg>

    <!-- PANTALLA FINAL -->
    <div id="blackout">

        <h1>
            Esto no termina aquí.<br>
            Algunas historias necesitan más de una página.
        </h1>

        <p>TO BE CONTINUED...</p>

    </div>

    <!-- CONTROLES -->
    <div id="controls">

        <button id="pauseButton" onclick="togglePause()">
            PAUSAR
        </button>

        <button onclick="restart()">
            REINICIAR
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
